<div class="section-card">
  <h4 style="margin-top: 0;">{{ site.group_name | default: site.name }}</h4>
  <p style="font-size: 0.875rem; color: var(--text-secondary);">{{ site.institution }}</p>
</div>

{% if site.data.pi[0].bio %}
<div class="section-card" style="margin-top: var(--space-6);">
  <h4 style="margin-top: 0;">课题组简介</h4>
  <p style="font-size: 0.875rem; color: var(--text-secondary);">{{ site.data.pi[0].bio }}</p>
</div>
{% endif %}

<div class="section-card" style="margin-top: var(--space-6);">
<h4 style="margin-top: 0;">News</h4>
<div class="news-timeline">
{% for article in site.data.news limit:3 %}
<div class="news-item">
<div class="news-date">{{ article.date }}</div>
<div class="news-headline">{{ article.headline }}</div>
</div>
{% endfor %}
</div>
<p style="margin-top: var(--space-4);"><a href="{{ site.url }}{{ site.baseurl }}/allnews.html">查看所有新闻 &rarr;</a></p>
</div>
