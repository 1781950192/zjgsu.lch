# ============================================================
# STEP 1: Your Identity (required)
# ============================================================
name: "李传煌"
title: "教授/博士 博士生导师"
institution: "浙江工商大学 信息与电子工程学院"
group_name: "智慧网络技术课题组"
email: chuanhuang.li@zjgsu.edu.cn
photo: lichuanhuang.webp  # place your photo in images/

# ============================================================
# STEP 2: Your Links (optional -- delete any you don't use)
# ============================================================
links:
  google_scholar: "https://scholar.google.com/citations?user=2fCA8JoAAAAJ"
  github: ""
  researchgate: ""
  orcid: ""
  twitter: ""
  linkedin: ""
  cv: ""  # e.g., "papers/cv.pdf" — leave blank to hide the CV icon

# ============================================================
# STEP 3: Site Settings
# ============================================================
accent_color: "#1a7a6d"      # theme color for links and buttons
dark_mode: true              # show dark mode toggle in navbar
description: "浙江工商大学李传煌教授课题组 - 智慧网络、软件定义网络、算力网络、边缘计算、人工智能"
baseurl: "/zjgsu.lch"      # 仓库名，用于 GitHub Pages
url: "https://1781950192.github.io"  # 你的 GitHub Pages 域名

# Google Analytics — paste your GA4 measurement ID, or leave blank
analytics:
  google_id: ""

# ============================================================
# STEP 4: Choose Your Pages (comment out any you don't need)
# ============================================================
nav_pages:
  - name: publications
  - name: research
  - name: team
  - name: teaching

# ============================================================
# Advanced Settings (you probably don't need to change these)
# ============================================================
include:
  - .htaccess
  - _pages

sass:
  quiet_deps: true
  style: compressed

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true

plugins: ["jekyll-scholar", "jekyll-sitemap"]

scholar:
  last_name: Doe
  first_name: [John]
  style: citesty
  locale: en
  source: /assets/
  bibliography: ref.bib
  bibliography_template: bibtemplate
  sort_by: year, month
  order: descending
  replace_strings: true
  join_strings: true
  details_dir: bibliography
  details_layout: bibtex.html
  details_link: Details
  query: "@*"
  bibliography_list_attributes:
    reversed: "reversed"

exclude:
  - Gemfile
  - Gemfile.lock
  - update_bootstrap.sh
  - switch_theme.sh
  - tags
  - Rakefile
  - node_modules
  - package.json
  - package-lock.json
  - docs
