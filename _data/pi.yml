  bio: >-
    李传煌，博士，教授，硕士生导师，浙江省万人计划科技创新领军人才。现任浙江工商大学科学技术部部长、网络与通信工程研究所副所长。曾任浙江工商大学信息与电子工程学院（人工智能学院）副院长、浙江工商大学网络信息中心副主任、浙江省东阳市副市长（挂职）。一直从事新一代网络核心技术的研究和产业化应用工作。
