<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200" viewBox="0 0 300 200">
  <rect width="300" height="200" fill="#e8f5e9"/>
  <!-- 无人机主体 -->
  <rect x="135" y="75" width="30" height="18" rx="5" fill="#388e3c"/>
  <circle cx="150" cy="84" r="12" fill="#66bb6a"/>
  <!-- 机臂 -->
  <line x1="150" y1="84" x2="80" y2="55" stroke="#388e3c" stroke-width="3"/>
  <line x1="150" y1="84" x2="220" y2="55" stroke="#388e3c" stroke-width="3"/>
  <line x1="150" y1="84" x2="80" y2="113" stroke="#388e3c" stroke-width="3"/>
  <line x1="150" y1="84" x2="220" y2="113" stroke="#388e3c" stroke-width="3"/>
  <!-- 螺旋桨 -->
  <ellipse cx="80" cy="55" rx="15" ry="5" fill="#81c784"/>
  <ellipse cx="220" cy="55" rx="15" ry="5" fill="#81c784"/>
  <ellipse cx="80" cy="113" rx="15" ry="5" fill="#81c784"/>
  <ellipse cx="220" cy="113" rx="15" ry="5" fill="#81c784"/>
  <!-- 信号波 -->
  <path d="M 90 140 Q 150 120 210 140" stroke="#66bb6a" stroke-width="2" fill="none"/>
  <path d="M 70 155 Q 150 125 230 155" stroke="#388e3c" stroke-width="1.5" fill="none"/>
  <text x="150" y="180" text-anchor="middle" font-size="16" fill="#388e3c">UAV Network</text>
</svg>
