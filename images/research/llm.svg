<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200" viewBox="0 0 300 200">
  <rect width="300" height="200" fill="#ede7f6"/>
  <!-- 大脑/神经网络 -->
  <circle cx="150" cy="75" r="30" fill="#7c4dff"/>
  <!-- 神经元连接 -->
  <circle cx="100" cy="90" r="10" fill="#b388ff"/>
  <circle cx="200" cy="90" r="10" fill="#b388ff"/>
  <circle cx="130" cy="120" r="10" fill="#b388ff"/>
  <circle cx="170" cy="120" r="10" fill="#b388ff"/>
  <circle cx="150" cy="55" r="10" fill="#b388ff"/>
  <!-- 连线 -->
  <line x1="150" y1="75" x2="100" y2="90" stroke="#651fff" stroke-width="2"/>
  <line x1="150" y1="75" x2="200" y2="90" stroke="#651fff" stroke-width="2"/>
  <line x1="150" y1="75" x2="130" y2="120" stroke="#651fff" stroke-width="2"/>
  <line x1="150" y1="75" x2="170" y2="120" stroke="#651fff" stroke-width="2"/>
  <line x1="150" y1="75" x2="150" y2="55" stroke="#651fff" stroke-width="2"/>
  <line x1="100" y1="90" x2="130" y2="120" stroke="#651fff" stroke-width="1.5"/>
  <line x1="200" y1="90" x2="170" y2="120" stroke="#651fff" stroke-width="1.5"/>
  <line x1="150" y1="55" x2="100" y2="90" stroke="#651fff" stroke-width="1.5"/>
  <line x1="150" y1="55" x2="200" y2="90" stroke="#651fff" stroke-width="1.5"/>
  <!-- 数据流 -->
  <rect x="190" y="115" width="40" height="15" rx="3" fill="#d1c4e9"/>
  <rect x="230" y="105" width="40" height="15" rx="3" fill="#d1c4e9"/>
  <line x1="200" y1="125" x2="230" y2="120" stroke="#b388ff" stroke-width="1.5"/>
  <text x="150" y="180" text-anchor="middle" font-size="16" fill="#7c4dff">LLM for Networks</text>
</svg>
